apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-auth-by-default
  namespace: default
  labels:
    app: k8s-auth-by-default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-auth-by-default
  template:
    metadata:
      labels:
        app: k8s-auth-by-default
    spec:
      containers:
      - name: webhook
        image: k8s-auth-by-default:latest
        imagePullPolicy: Never # For local development with Kind/Minikube
        args:
        - -tlsCertFile=/etc/webhook/certs/tls.crt
        - -tlsKeyFile=/etc/webhook/certs/tls.key
        ports:
        - containerPort: 8443
        volumeMounts:
        - name: webhook-certs
          mountPath: /etc/webhook/certs
          readOnly: true
      volumes:
      - name: webhook-certs
        secret:
          secretName: k8s-auth-by-default-certs
      serviceAccountName: k8s-auth-by-default-sa
